version: '3.9'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: group5capstone
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Oklangyan421!
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"

volumes:
  pgdata:
